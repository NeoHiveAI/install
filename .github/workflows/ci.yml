# Managed from the MemVec monorepo (sync-repos/install/src/).
# Edits made directly in NeoHiveAI/install will be overwritten on the next release sync.
name: CI

on:
    push:
    pull_request:

jobs:
    shellcheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: ShellCheck install.sh
              run: shellcheck install.sh
            - name: ShellCheck smoke.sh
              run: shellcheck test/smoke.sh
            - name: ShellCheck dry-run.sh
              run: shellcheck test/dry-run.sh
